name: restaurant_client
description: "A new Flutter project."
# Ce fichier gère toutes les dépendances du projet.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # google_fonts : permet d'utiliser des polices Google (Nunito, Pacifico)
  # sans télécharger les fichiers manuellement.
  google_fonts: ^6.2.1
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
